name: Build Mizanora APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    # Set working directory to MizanoraAndroid folder
    defaults:
      run:
        working-directory: ./MizanoraAndroid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # NOTE: You need a Gemini API key for the app to actually work.
      # Add it in GitHub repo Settings -> Secrets and variables -> Actions
      # as a secret named GEMINI_API_KEY. It gets baked into the debug
      # build's BuildConfig so you don't have to type it on the phone.
      - name: Build debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew assembleDebug -PgeminiApiKey="$GEMINI_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mizanora-debug-apk
          path: MizanoraAndroid/app/build/outputs/apk/debug/app-debug.apk
          
